:root[data-theme="dark"]{--bg:#0f1216;--panel:#171b21;--ink:#e8ecf1;--muted:#98a2b3;--line:#272d36;

*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);

#app{display:grid;grid-template-columns:380px 1fr;height:100dvh}
#panel{background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch}
#map{height:100%;width:100%;background:var(--chip)}
.pad{padding:16px}
h1{font-size:17px;margin:0 0 2px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:12.5px;margin:0 0 14px}
.src{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted);margin:0 0 10px;flex-wrap:wrap}
.src button{font:inherit;font-size:11.5px;padding:5px 10px;border-radius:7px;border:1px solid var(--line);
background:var(--chip);color:var(--ink);cursor:pointer}
.tiles{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);margin:0 0 10px}
.tiles select{flex:1;font:inherit;font-size:12px;color:var(--ink);background:var(--chip);
border:1px solid var(--line);border-radius:8px;padding:6px 8px;cursor:pointer}
.msg{margin:0 0 14px;padding:10px 12px;border-radius:9px;background:var(--warnbg);
border:1px solid var(--warnline);color:var(--warn);font-size:12px;line-height:1.5}
.msg code{font-size:11px;background:rgba(127,127,127,.18);padding:1px 5px;border-radius:4px}
.msg a{color:inherit}
#drop{display:none;margin:0 0 14px;padding:22px 16px;border:2px dashed var(--line);border-radius:11px;
text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--chip)}
#drop.over{border-color:var(--accent);color:var(--accent)}
#drop strong{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.zh{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;
margin:14px 0 5px;display:flex;align-items:center;gap:7px}
.zh .dot{width:9px;height:9px;border-radius:50%;flex:none}
.lg{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.lg button{display:flex;align-items:baseline;gap:9px;width:100%;text-align:left;cursor:pointer;
background:transparent;border:1px solid transparent;border-radius:8px;padding:7px 9px;color:var(--ink);
font:inherit;font-size:13px;line-height:1.35}
.lg button:hover{background:var(--chip)}
.lg button[aria-pressed="true"]{background:var(--chip);border-color:var(--line);font-weight:650}
.lg .dt{margin-left:auto;color:var(--muted);font-size:11.5px;font-weight:400;white-space:nowrap}
.hd{margin:16px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.hd h2{font-size:15px;margin:0 0 6px}
.meta{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:3px 9px;font-size:11.5px;color:var(--muted)}
ol.stops{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
ol.stops li>button{width:100%;text-align:left;background:transparent;border:0;border-radius:9px;
padding:9px 10px;cursor:pointer;color:var(--ink);font:inherit;display:grid;grid-template-columns:24px 1fr;gap:10px}
ol.stops li>button:hover{background:var(--chip)}
.num{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11.5px;
font-weight:700;color:#fff;font-variant-numeric:tabular-nums}
.nm{font-weight:600;font-size:13.5px;letter-spacing:-.005em;display:block}
.ad{color:var(--muted);font-size:12px;margin-top:1px;display:block}
.bd{color:var(--muted);font-size:11.5px;margin-top:3px;display:block}
.tags{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
.t{font-size:10.5px;padding:2px 7px;border-radius:999px;background:var(--chip);color:var(--muted)}
.t.anchor{background:color-mix(in srgb,var(--accent) 18%,transparent);color:var(--accent);font-weight:600}
.t.unvetted{background:color-mix(in srgb,#b54708 16%,transparent);color:#b54708;font-weight:600}
@media (prefers-color-scheme:dark){.t.unvetted{color:#f0a868}}
.unm{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.unm h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.unm .it{padding:8px 10px;border-radius:9px;background:var(--chip);margin-bottom:6px}
.unm .nm{font-size:13px}.unm .rs{color:var(--muted);font-size:11.5px;margin-top:3px}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:11px;box-shadow:var(--shadow)}
.leaflet-popup-tip{background:var(--panel)}
.leaflet-popup-content{margin:12px 14px;font-size:13px;line-height:1.5}
.leaflet-container{background:var(--chip);font:inherit}
.leaflet-control-attribution{background:var(--panel)!important;color:var(--muted)!important;font-size:10.5px!important}
.leaflet-control-attribution a{color:var(--muted)!important}
.tgb{display:flex;flex-wrap:wrap;gap:5px;margin:0 0 6px}
.tg{font:inherit;font-size:11.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.tg small{color:var(--muted);margin-left:3px}
.tg[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:var(--accent);color:var(--accent)}
.pt{margin:6px 0;display:flex;flex-wrap:wrap;gap:4px}
.pf summary{cursor:pointer;font-size:12px;font-weight:600;margin:6px 0}
.pf div{font-size:12px;color:var(--muted);line-height:1.45}
.modes{display:flex;gap:6px;margin:0 0 10px}
.modes button{flex:1;font:inherit;font-size:13px;font-weight:600;padding:8px 10px;border-radius:9px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer}
.modes button[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 18%,transparent);border-color:var(--accent);color:var(--accent)}
#planlist{display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
#planlist .card{text-align:left;font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;display:flex;flex-direction:column;gap:2px}
#planlist .card span{font-size:12px;color:var(--muted)}
#planlist .card:hover{background:var(--chip)}
.pback{font:inherit;font-size:12px;padding:4px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);color:var(--ink);cursor:pointer;margin-bottom:8px}
ol.stops li.dim{opacity:.35}
.pn{font-weight:700;font-size:14px;margin-bottom:2px}
.pa{color:var(--muted);font-size:12px;margin-bottom:7px}
.pb{margin-bottom:8px}.pm{font-size:11.5px;color:var(--muted)}
.mk{display:grid;place-items:center;border-radius:999px;color:#fff;font-weight:700;font-size:12px;
border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4);font-variant-numeric:tabular-nums}
.mk.done{opacity:.4}
.t.done{background:color-mix(in srgb,#2f9e44 18%,transparent);color:#2f9e44;font-weight:600}
.pv{display:block;margin-top:10px;width:100%;font:inherit;font-size:12.5px;font-weight:600;
padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--chip);
color:var(--ink);cursor:pointer;text-align:center;text-decoration:none}
.pv.on{background:color-mix(in srgb,#2f9e44 16%,transparent);border-color:#2f9e44;color:#2f9e44}
ol.stops li.done .nm,ol.stops li.done .ad,ol.stops li.done .bd{opacity:.55}
#toggle{display:none;position:fixed;z-index:1000;left:50%;transform:translateX(-50%);
bottom:calc(14px + env(safe-area-inset-bottom));background:var(--panel);color:var(--ink);
border:1px solid var(--line);border-radius:999px;padding:10px 20px;font:inherit;font-size:13.5px;
font-weight:600;box-shadow:var(--shadow);cursor:pointer}
@media (max-width:860px){#app{grid-template-columns:1fr;grid-template-rows:1fr}
#panel{position:fixed;inset:0;z-index:900;border-right:0;overflow-y:auto;padding-bottom:76px;
transform:translateY(0);transition:transform .22s ease}
body.map-mode #panel{transform:translateY(100%)}#map{grid-row:1}#toggle{display:block}}

<body>
<div id="app">
  <aside id="panel"><div class="pad">
    <h1>Carte de prospection à Toulouse</h1>
    <p class="sub">Entreprises à démarcher à pied, par zone. Filtrez par tag.</p>
    <div class="src"><span id="count">…</span></div>
    <div class="modes" id="modes" style="display:none"><button id="m-explore" aria-pressed="true">Explorer</button><button id="m-plan" aria-pressed="false">Trajets d'Alex</button></div>
    <div id="planlist" style="display:none"></div>
    <label class="tiles" id="fitrow" style="display:none">Mon adéquation <select id="fitsel"><option value="C">Toutes</option>
      <option value="B">Adéquation A + B</option><option value="A">Adéquation A</option></select></label>
    <div id="tagbar"></div>
    <div id="legend"></div>
    <div class="hd"><h2 id="htitle"></h2><div class="meta" id="meta"></div></div>
    <ol class="stops" id="stops"></ol>
    <div class="unm" id="unmapped"></div>
  </div></aside>
  <div id="map"></div>

<script>
const CSV_NAME='walking-list.csv';
/* ---------- visits: the note files are the record. A tap is held here only until the next
   build has read the notes, then the files take authority back. ---------- */
const NODEEL=document.getElementById('nodes');
const VAULT=NODEEL&&NODEEL.dataset.vault||'';
const MINE=!!VAULT;
const NODES=(()=>{const m={};
 if(NODEEL)NODEEL.textContent.split('\n').forEach(l=>{const p=l.split('\t');
  if(p.length===3)m[p[0]]={done:p[1]==='1',f:p[2]}});return m})();
const SCAN=NODEEL&&NODEEL.dataset.scan||'';
const DIR=(NODEEL&&NODEEL.dataset.dir||'.').replace(/^\.$/,'');
const LOCAL=(()=>{let o={};try{o=JSON.parse(localStorage.getItem('visits')||'{}')}catch(e){}
 Object.keys(o).forEach(k=>{if(!o[k]||o[k].s!==SCAN)delete o[k]});return o})();
const isDone=k=>k in LOCAL?!!LOCAL[k].v:!!(NODES[k]&&NODES[k].done);
function setDone(k,v){
 if(NODES[k]&&NODES[k].done===v)delete LOCAL[k]; else LOCAL[k]={v:v?1:0,s:SCAN};
 try{localStorage.setItem('visits',JSON.stringify(LOCAL))}catch(e){}}
function noteURL(k,tick){const n=NODES[k];if(!n)return null;
 const f=encodeURIComponent((DIR?DIR+'/':'')+'nodes/'+n.f.replace(/\.md$/,''));
 return tick
  ?'obsidian://new?vault='+encodeURIComponent(VAULT)+'&file='+f+'&append=true&content='+
   encodeURIComponent('\n- [x] visited '+new Date().toISOString().slice(0,10)+'\n')
  :'obsidian://open?vault='+encodeURIComponent(VAULT)+'&file='+f}
const PALETTE=['#d6336c','#e8590c','#a1690a','#2f9e44','#1971c2','#6741d9','#0c8599','#c2255c','#087f5b'];
const SESSCOL=['#d6336c','#1971c2','#2f9e44','#e8590c','#6741d9','#0c8599','#a1690a','#c2255c'];
const OSMATTR='&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors';
const ESRIATTR='Tiles &copy; Esri';
const PROVIDERS=[
 {name:'OpenStreetMap France',data:'OpenStreetMap',cors:true,dark:false,
  url:'https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png',opts:{subdomains:'abc',maxZoom:19,attribution:OSMATTR}},
 {name:'OpenStreetMap Germany',data:'OpenStreetMap',cors:false,dark:false,
  url:'https://tile.openstreetmap.de/{z}/{x}/{y}.png',opts:{maxZoom:18,attribution:OSMATTR}},
 {name:'Esri Streets',data:'Esri',cors:false,dark:false,
  url:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  opts:{maxZoom:19,attribution:ESRIATTR}},
 {name:'Esri Light Gray',data:'Esri',cors:false,dark:false,
  url:'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}',
  opts:{maxZoom:16,attribution:ESRIATTR}},
 {name:'OpenTopoMap',data:'OpenStreetMap',cors:true,dark:false,
  url:'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',opts:{subdomains:'abc',maxZoom:17,
  attribution:OSMATTR+' &middot; <a href="https://opentopomap.org">OpenTopoMap</a>'}},
 {name:'OpenStreetMap (osm.org)',data:'OpenStreetMap',cors:true,dark:false,osm:true,
  url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',opts:{maxZoom:19,attribution:OSMATTR}}
];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const map=L.map('map',{zoomControl:true}).setView([43.60,1.44],12);
const layer=L.layerGroup().addTo(map);
let pi=-1,tiles=null,markers={},byKey={},MODEL=null,cur=null,RECS=null,TOTAL=0;
let FITSEL='C';try{FITSEL=localStorage.getItem('fitsel')||'C'}catch(e){}
const TRANK={A:0,B:1,C:2};
const FITEL=document.getElementById('fit');
const FIT=(()=>{const m={};if(FITEL)FITEL.textContent.trim().split('\n').slice(1).forEach(l=>{const p=l.split(',');if(p.length===3)m[p[0]]={fit:p[1],anchor:p[2]==='yes'}});return m})();
const HASFIT=Object.keys(FIT).length>0;
const TAGSEL=new Set();
const lst=v=>(v||'').split(';').filter(Boolean);
const tagName=t=>t.replace(/-/g,' ');
const shown=r=>(!TAGSEL.size||lst(r.tags).some(t=>TAGSEL.has(t)))&&(!HASFIT||!FIT[r.id]||TRANK[FIT[r.id].fit]<=TRANK[FITSEL]);
const probed=PROVIDERS.map(()=>null);

/* ---------- tiles: a blocked or key-gated server returns the SAME image for every
   coordinate at any status code, so compare two different tiles ---------- */
function tileURL(p,z,x,y){const sd=p.opts.subdomains;
 const s=typeof sd==='string'?sd[0]:(sd&&sd[0])||'a';
 return p.url.replace('{s}',s).replace('{z}',z).replace('{x}',x).replace('{y}',y).replace('{r}','')}
function sameBytes(a,b){if(a.byteLength!==b.byteLength)return false;
 const x=new Uint8Array(a),y=new Uint8Array(b);
 for(let i=0;i<x.length;i++)if(x[i]!==y[i])return false;return true}
function imgLoads(u){return new Promise(r=>{const im=new Image();let d=false;
 im.onload=()=>{if(!d){d=true;r(true)}};im.onerror=()=>{if(!d){d=true;r(false)}};
 setTimeout(()=>{if(!d){d=true;r(false)}},8000);im.src=u})}
async function probe(i){const p=PROVIDERS[i],uA=tileURL(p,13,4131,2990),uB=tileURL(p,13,4132,2991);
 if(p.cors){try{const[ra,rb]=await Promise.all([fetch(uA,{cache:'no-store',mode:'cors'}),fetch(uB,{cache:'no-store',mode:'cors'})]);
  if(ra.status!==200)return{ok:false,why:'HTTP '+ra.status};
  const[ba,bb]=await Promise.all([ra.arrayBuffer(),rb.arrayBuffer()]);
  if(sameBytes(ba,bb))return{ok:false,why:'placeholder tile'};
  if(ba.byteLength<400)return{ok:false,why:'empty tile'};return{ok:true}}catch(e){}}
 return await imgLoads(uA)?{ok:true}:{ok:false,why:'blocked'}}
function applyFilter(){const p=PROVIDERS[pi];
 const d=window.matchMedia('(prefers-color-scheme: dark)').matches;
 const pane=document.querySelector('.leaflet-tile-pane');
 if(pane)pane.style.filter=(d&&p&&!p.dark)?'invert(1) hue-rotate(180deg) brightness(.94) contrast(.92)':''}
function useProvider(i){pi=i;if(tiles)map.removeLayer(tiles);
 tiles=L.tileLayer(PROVIDERS[i].url,PROVIDERS[i].opts).addTo(map);setTimeout(applyFilter,60)}
async function chooseProvider(){for(let i=0;i<PROVIDERS.length;i++){const r=await probe(i);probed[i]=r;if(r.ok){useProvider(i);return}}}

/* ---------- CSV ---------- */
function parseCSV(text){
 const rows=[];let f='',row=[],q=false;
 text=text.replace(/^﻿/,'').replace(/\r\n?/g,'\n');
 for(let i=0;i<text.length;i++){const c=text[i];
  if(q){ if(c==='"'){ if(text[i+1]==='"'){f+='"';i++} else q=false } else f+=c }
  else if(c==='"')q=true;
  else if(c===','){row.push(f);f=''}
  else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''}
  else f+=c}
 if(f.length||row.length){row.push(f);rows.push(row)}
 while(rows.length&&rows[0].every(c=>!String(c).trim()))rows.shift();
 const head=rows.shift().map(h=>h.trim());
 return rows.filter(r=>r.length>1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]||'').trim());return o});
}
function buildModel(rows){
 const zones=[];rows.forEach(r=>{if(r.zone&&!zones.includes(r.zone))zones.push(r.zone)});
 const zcol={};zones.forEach((z,i)=>zcol[z]=PALETTE[i%PALETTE.length]);
 const S={},pool={},unplaced=[];
 rows.forEach(r=>{
  const lat=parseFloat(r.lat),lon=parseFloat(r.lon);
  const t={n:r.company,a:r.address,b:r.what_they_build,sz:r.staff,an:!!(FIT[r.id]&&FIT[r.id].anchor),ck:r.cum_km,
           z:r.zone,tg:lst(r.tags),fit:FIT[r.id]?FIT[r.id].fit:'',tags:r.tags,brief:r.brief,src:r.source,lat:lat,lon:lon,ok:isFinite(lat)&&isFinite(lon),
           key:r.id};
  t.done=isDone(t.key);
  if(!t.ok){unplaced.push(t);return}
  const id=parseInt(r.session,10);
  if(isFinite(id)){(S[id]=S[id]||{id:id,z:r.zone,stops:[]}).stops.push(
      Object.assign(t,{o:parseInt(r.order,10)||0}))}
  else (pool[r.zone]=pool[r.zone]||[]).push(t)})
 const sessions=Object.values(S).sort((a,b)=>a.id-b.id);
 sessions.forEach(s=>{s.stops.sort((a,b)=>a.o-b.o);s.c=zcol[s.z]||'#666';
   s.stops.forEach((t,i)=>t.o=i+1)});
 return{sessions,pool,unplaced,zcol,zones,count:rows.length};
}

/* ---------- routing: real pedestrian geometry, fetched per session and cached ---------- */
function hash(s){let h=5381;for(let i=0;i<s.length;i++)h=((h<<5)+h+s.charCodeAt(i))|0;return String(h)}
async function routeFor(s){
 const key='r:'+hash(s.stops.map(t=>t.lat.toFixed(5)+','+t.lon.toFixed(5)).join(';'));
 try{const c=localStorage.getItem(key);if(c)return JSON.parse(c)}catch(e){}
 if(s.stops.length<2)return{path:s.stops.map(t=>[t.lat,t.lon]),dist:0,dur:0};
 const co=s.stops.map(t=>t.lon.toFixed(6)+','+t.lat.toFixed(6)).join(';');
 try{
  const r=await fetch('https://routing.openstreetmap.de/routed-foot/route/v1/foot/'+co+
                      '?overview=full&geometries=geojson',{mode:'cors'});
  const d=await r.json();
  if(d.code!=='Ok')throw 0;
  const rt=d.routes[0];
  const out={path:rt.geometry.coordinates.map(p=>[p[1],p[0]]),dist:rt.distance,dur:rt.duration};
  try{localStorage.setItem(key,JSON.stringify(out))}catch(e){}
  return out;
 }catch(e){ return{path:s.stops.map(t=>[t.lat,t.lon]),dist:null,dur:null,failed:true} }
}

function icon(c,l,done){const h=26,w=Math.max(h,String(l).length*8+14);
 return L.divIcon({html:'<div class="mk'+(done?' done':'')+'" style="background:'+c+';width:'+w+'px;height:'+h+'px">'+l+'</div>',
  className:'',iconSize:[w,h],iconAnchor:[w/2,h/2],popupAnchor:[0,-h/2]})}
function clump(stops){const g=[];
 stops.forEach(t=>{const h=g.find(x=>Math.hypot((x[0].lat-t.lat)*111000,(x[0].lon-t.lon)*80000)<=10);
  if(h)h.push(t);else g.push([t])});return g}
function groupLabel(g){const o=g.map(t=>t.o).filter(x=>typeof x==='number').sort((a,b)=>a-b);
 if(!o.length)return '+';
 return o.length>1?o[0]+'\u2013'+o[o.length-1]:String(o[0])}
function place(g,col,lbl,pre){
 const t0=g[0];
 const m=L.marker([t0.lat,t0.lon],{icon:icon(col,lbl,g.every(t=>t.done||t.dim)),title:g.map(t=>t.n).join(' / ')})

   {maxHeight:320});
 if(pre)m.getPopup().setContent((pre)+m.getPopup().getContent());
 m.addTo(layer);
 g.forEach(t=>{byKey[t.key]={m:m,t:t,c:col,lbl:lbl,g:g}});return m}
function extra(t){
 const src=(t.src||'').split(/\s+/).filter(u=>/^https?:\/\//.test(u)).map(u=>{let h=u;try{h=new URL(u).hostname.replace(/^www\./,'')}catch(e){}
  return '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(h)+'</a>'}).join(' · ');
 return (t.tg&&t.tg.length?'<div class="pt">'+t.tg.map(x=>'<span class="t">'+esc(tagName(x))+'</span>').join('')+'</div>':'')+
  (t.brief?'<details class="pf"><summary>Fiche</summary><div>'+esc(t.brief)+(src?'<br>Sources : '+src:'')+'</div></details>':'')}
function popup(t){const b=[];if(t.fit)b.push('adéquation '+t.fit);if(t.an)b.push('ancre');if(t.sz)b.push(t.sz+' salariés');if(t.ck)b.push(t.ck+' km depuis le départ');
 return '<div class="pn">'+esc(t.n)+'</div><div class="pa">'+esc(t.a)+'</div>'+
  '<div class="pb">'+esc(t.b)+'</div><div class="pm">'+b.map(esc).join(' · ')+'</div>'+extra(t)+
  (MINE&&NODES[t.key]?'<a class="pv'+(t.done?' on':'')+'" data-key="'+esc(t.key)+'" href="'+
   esc(noteURL(t.key,!t.done)||'#')+'" rel="noopener">'+
   (t.done?'Visité ✓ · annuler':'Marquer visité · ouvrir la note')+'</a>':'')}
function stopHTML(t,col,n,key){const g=[];
 if(t.fit)g.push('<span class="t">adéquation '+esc(t.fit)+'</span>');
 if(t.done)g.push('<span class="t done">visité</span>');
 if(t.an)g.push('<span class="t anchor">ancre</span>');
 if(t.sz)g.push('<span class="t">'+esc(t.sz)+' salariés</span>');
 (t.tg||[]).slice(0,4).forEach(x=>g.push('<span class="t">'+esc(tagName(x))+'</span>'));
 if(t.ck)g.push('<span class="t">'+esc(t.ck)+' km depuis le départ</span>');
 return '<li data-key="'+esc(t.key||'')+'"'+(t.done||t.dim?' class="'+(t.done?'done':'')+(t.dim?' dim':'')+'"':'')+'><button data-n="'+esc(key||t.n)+'"><span class="num" style="background:'+col+'">'+n+'</span>'+
  '<span><span class="nm">'+esc(t.n)+'</span><span class="ad">'+esc(t.a)+'</span>'+
  '<span class="bd">'+esc(t.b)+'</span><span class="tags">'+g.join('')+'</span></span></button></li>'}
/* one tap: remember it here, redraw, then hand the note to Obsidian with the tick appended */
map.on('popupopen',e=>{e.popup.getElement().querySelectorAll('.pv').forEach(b=>{if(b.dataset.wired)return;
 b.dataset.wired='1';
 b.addEventListener('click',()=>{const k=b.dataset.key,r=byKey[k];if(!r)return;
  const v=!r.t.done;setDone(k,v);r.t.done=v;
  r.m.setIcon(icon(r.c,r.lbl,r.g.every(t=>t.done||t.dim)));
  const li=document.querySelector('#stops li[data-key="'+k+'"]');
  if(li){li.classList.toggle('done',v);const tg=li.querySelector('.tags'),ex=tg&&tg.querySelector('.t.done');
   if(tg&&v&&!ex)tg.insertAdjacentHTML('afterbegin','<span class="t done">visité</span>');
   if(ex&&!v)ex.remove()}
  const chip=document.getElementById('dnchip');
  if(chip)chip.textContent=Object.values(byKey).filter(x=>x.t.done).length+' visités';
  /* the link itself carries the tap to Obsidian; retarget it once that navigation is away,
     because rewriting it inside the handler can cancel it */
  setTimeout(()=>{b.className='pv'+(v?' on':'');
   b.textContent=v?'Visité ✓ · annuler':'Marquer visité · ouvrir la note';
   b.href=noteURL(k,!v)||'#'},0)})})});
function wire(){document.querySelectorAll('#stops button').forEach(b=>b.addEventListener('click',()=>{
 const m=markers[b.dataset.n];if(!m)return;map.setView(m.getLatLng(),17,{animate:true});m.openPopup();
 if(window.matchMedia('(max-width:860px)').matches){document.body.classList.add('map-mode');sync()}}))}

async function show(kind,id){
 cur={kind,id};
 layer.clearLayers();markers={};byKey={};
 document.querySelectorAll('#legend button').forEach(b=>
  b.setAttribute('aria-pressed',String(b.dataset.k===kind&&b.dataset.id===String(id))));
 if(kind==='s'){
  const s=MODEL.sessions.find(x=>x.id===+id);if(!s)return;
  clump(s.stops).forEach(g=>{const m=place(g,s.c,groupLabel(g));g.forEach(t=>{markers[t.n]=m})});
  map.fitBounds(L.latLngBounds(s.stops.map(t=>[t.lat,t.lon])).pad(0.15));
  const anc=s.stops.filter(t=>t.an).length,dn=s.stops.filter(t=>t.done).length;
  document.getElementById('htitle').textContent=s.z;
  document.getElementById('meta').innerHTML='<span class="chip">'+s.stops.length+' entreprises</span>'+
   '<span class="chip" id="rt">calcul de l\'itinéraire…</span>'+
   (anc?'<span class="chip">'+anc+' anchor'+(anc>1?'s':'')+'</span>':'')+
   (MINE?'<span class="chip" id="dnchip">'+dn+' visited</span>':'');
  document.getElementById('stops').innerHTML=s.stops.map(t=>stopHTML(t,s.c,t.o)).join('');wire();
  const r=await routeFor(s);
  if(cur.kind!=='s'||String(cur.id)!==String(id))return;
  if(r.path.length>1)L.polyline(r.path,{color:s.c,weight:4,opacity:.65}).addTo(layer);
  const el=document.getElementById('rt');
  if(el)el.textContent=r.failed?'itinéraire indisponible'
    :(r.dist/1000).toFixed(1)+' km · '+Math.round(r.dur/60)+' min à pied · ~'+
     Math.round(r.dur/60+s.stops.length*8)+' min au total';
  if(r.path.length>1)map.fitBounds(L.latLngBounds(r.path).pad(0.12));
 }else if(kind==='z'){
  const ss=MODEL.sessions.filter(x=>x.z===id);
  if(!ss.length)return;
  const all=[];
  ss.forEach((s,i)=>{const col=SESSCOL[i%SESSCOL.length];s._c=col;
   s.stops.forEach(t=>all.push([t.lat,t.lon]));
   clump(s.stops).forEach(g=>{const m=place(g,col,groupLabel(g),'<div class="pm" style="margin-bottom:5px">Parcours '+s.id+'</div>');
    g.forEach(t=>{markers['S'+s.id+':'+t.n]=m})})});
  map.fitBounds(L.latLngBounds(all).pad(0.12));
  document.getElementById('htitle').textContent=id+' \u2014 all sessions';
  document.getElementById('meta').innerHTML='<span class="chip">'+ss.length+' parcours</span>'+
   '<span class="chip">'+ss.reduce((a,s)=>a+s.stops.length,0)+' entreprises</span>'+
   '<span class="chip">calcul de l\'itinéraire\u2026</span>';
  document.getElementById('stops').innerHTML=ss.map(s=>
   '<li style="margin-top:8px"><div class="zh" style="margin:6px 0 2px">'+
   '<span class="dot" style="background:'+s._c+'"></span>Parcours '+s.id+' \u00b7 '+s.stops.length+' entreprises</div></li>'+
   s.stops.map(t=>stopHTML(t,s._c,t.o,'S'+s.id+':'+t.n)).join('')).join('');
  wire();
  let td=0,tt=0,okAll=true;
  for(const s of ss){
   const r=await routeFor(s);
   if(cur.kind!=='z'||cur.id!==id)return;
   if(r.path.length>1)L.polyline(r.path,{color:s._c,weight:3.5,opacity:.6}).addTo(layer);
   if(r.failed)okAll=false; else {td+=r.dist;tt+=r.dur}
  }
  document.getElementById('meta').innerHTML='<span class="chip">'+ss.length+' parcours</span>'+
   '<span class="chip">'+ss.reduce((a,s)=>a+s.stops.length,0)+' entreprises</span>'+
   (okAll?'<span class="chip">'+(td/1000).toFixed(1)+' km de marche au total</span>'+
          '<span class="chip">'+Math.round(tt/60)+' min à pied</span>':'');
 }else{
  const st=MODEL.pool[id]||[];const col=MODEL.zcol[id]||'#666';
  clump(st).forEach(g=>{const m=place(g,col,'·');g.forEach(t=>{markers[t.n]=m})});
  if(st.length)map.fitBounds(L.latLngBounds(st.map(t=>[t.lat,t.lon])).pad(0.15));
  document.getElementById('htitle').textContent=id==='Hors zones'?'Hors zones · à rejoindre en transport':'Non planifiées · '+id;
  document.getElementById('meta').innerHTML='<span class="chip">'+st.length+' cibles</span>'+
   '<span class="chip">'+(id==='Hors zones'?'transport en commun':'hors parcours')+'</span>';
  document.getElementById('stops').innerHTML=st.map(t=>stopHTML(t,col,'·')).join('');wire();
 }
}

/* ---------- dates proposées ---------- */
let MODE='explore',PLAN=null,ALLBY={},planDay=null,dayShown=null;
const cap=x=>x.charAt(0).toUpperCase()+x.slice(1);
const dayLabel=d=>cap(new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}));
const hm=x=>x.replace(':','h');
function showEl(id,on){document.getElementById(id).style.display=on?'':'none'}
function planList(){planDay=null;dayShown=null;TAGSEL.clear();showEl('tagbar',false);layer.clearLayers();markers={};byKey={};
 showEl('planlist',true);document.querySelector('.hd').style.display='none';document.getElementById('stops').innerHTML='';
 const all=[];
 document.getElementById('planlist').innerHTML=PLAN.days.map((d,i)=>{const st=d.stops.map(k=>ALLBY[k]).filter(Boolean);
  st.forEach(t=>all.push([t.lat,t.lon]));
  return '<button class="card" data-i="'+i+'"><strong>'+esc(dayLabel(d.date))+'</strong><span>'+hm(d.start)+' – '+hm(d.end)+' · '+esc(d.zone)+
   '</span><span>'+st.length+' entreprises'+((d.extra||[]).length?' + '+d.extra.length+' sur le chemin':'')+' · départ : '+esc(st[0]?st[0].a:'')+'</span></button>'}).join('');
 document.querySelectorAll('#planlist .card').forEach(b=>b.addEventListener('click',()=>showPlanDay(+b.dataset.i)));
 if(all.length)map.fitBounds(L.latLngBounds(all).pad(0.1))}
async function showPlanDay(i){
 const d=PLAN.days[i];planDay=i;
 const st=d.stops.map(k=>ALLBY[k]).filter(Boolean);
 const ex=(d.extra||[]).map(k=>ALLBY[k]).filter(Boolean);
 layer.clearLayers();markers={};byKey={};
 if(dayShown!==i){TAGSEL.clear();dayShown=i}
 renderTags(st.concat(ex).map(t=>t.tg));
 st.forEach((t,j)=>{t.o=j+1;t.dim=TAGSEL.size>0&&!t.tg.some(x=>TAGSEL.has(x))});
 ex.forEach(t=>{t.o='+';t.dim=TAGSEL.size>0&&!t.tg.some(x=>TAGSEL.has(x))});
 showEl('planlist',false);document.querySelector('.hd').style.display='';
 const col='#1971c2';
 clump(st.concat(ex)).forEach(g=>{const m=place(g,g.some(t=>t.o!=='+')?col:'#868e96',groupLabel(g));g.forEach(t=>{markers[t.n]=m})});
 document.getElementById('htitle').innerHTML='<button class="pback" id="planback">← Tous les trajets</button><br>'+esc(dayLabel(d.date));
 document.getElementById('planback').addEventListener('click',planList);
 document.getElementById('meta').innerHTML='<span class="chip">'+hm(d.start)+' – '+hm(d.end)+'</span><span class="chip">'+esc(d.zone)+'</span>'+
  '<span class="chip">'+st.length+' entreprises</span>'+(ex.length?'<span class="chip">+ '+ex.length+' sur le chemin</span>':'')+'<span class="chip" id="rt">calcul de l\'itinéraire…</span>';
 document.getElementById('stops').innerHTML=st.map(t=>stopHTML(t,col,t.o)).join('')+
  (ex.length?'<li style="margin-top:8px"><div class="zh" style="margin:10px 0 2px"><span class="dot" style="background:#868e96"></span>Sur le chemin · autres profils</div></li>'+ex.map(t=>stopHTML(t,'#868e96','+')).join(''):'');wire();
 map.fitBounds(L.latLngBounds(st.map(t=>[t.lat,t.lon])).pad(0.15));
 const r=await routeFor({stops:st});
 if(planDay!==i||MODE!=='plan')return;
 if(r.path.length>1)L.polyline(r.path,{color:col,weight:4,opacity:.65}).addTo(layer);
 const el=document.getElementById('rt');
 if(el)el.textContent=r.failed?'itinéraire indisponible':(r.dist/1000).toFixed(1)+' km · '+Math.round(r.dur/60)+' min à pied';
 if(r.path.length>1)map.fitBounds(L.latLngBounds(r.path).pad(0.12))}
function setMode(m){MODE=m;
 document.getElementById('m-explore').setAttribute('aria-pressed',String(m==='explore'));
 document.getElementById('m-plan').setAttribute('aria-pressed',String(m==='plan'));
 showEl('legend',m==='explore');showEl('fitrow',m==='explore'&&HASFIT);document.querySelector('.src').style.display=m==='explore'?'':'none';
 TAGSEL.clear();
 if(m==='plan'){planList()}
 else{showEl('planlist',false);document.querySelector('.hd').style.display='';
  buildFilters(RECS);window.refilter()}}
function initPlan(){const el=document.getElementById('plan');
 try{PLAN=JSON.parse(el.textContent.trim()||'null')}catch(e){PLAN=null}
 if(!PLAN||!PLAN.days||!PLAN.days.length)return;
 const all=buildModel(RECS);
 all.sessions.forEach(s=>s.stops.forEach(t=>{ALLBY[t.key]=t}));
 Object.values(all.pool).forEach(a=>a.forEach(t=>{ALLBY[t.key]=t}));
 showEl('modes',true);
 document.getElementById('m-explore').addEventListener('click',()=>setMode('explore'));
 document.getElementById('m-plan').addEventListener('click',()=>setMode('plan'))}
function renderAll(){
 const M=MODEL;
 document.getElementById('legend').innerHTML=M.zones.map(z=>{
  const ss=M.sessions.filter(s=>s.z===z),p=M.pool[z];
  if(!ss.length&&!p)return '';
  return '<div class="zh"><span class="dot" style="background:'+M.zcol[z]+'"></span>'+esc(z)+'</div><div class="lg">'+
   (ss.length>1?'<button data-k="z" data-id="'+esc(z)+'" aria-pressed="false">'+
     '<span>Tous les '+ss.length+' parcours</span><span class="dt">'+
     ss.reduce((a,s)=>a+s.stops.length,0)+' entreprises</span></button>':'')+
   ss.map(s=>'<button data-k="s" data-id="'+s.id+'" aria-pressed="false"><span>Parcours '+s.id+
    '</span><span class="dt">'+s.stops.length+' entreprises</span></button>').join('')+
   (p?'<button data-k="u" data-id="'+esc(z)+'" aria-pressed="false"><span>'+(z==='Hors zones'?'Voir les entreprises hors zones':'Non planifiées')+'</span>'+
    '<span class="dt">'+p.length+'</span></button>':'')+'</div>'}).join('');
 document.querySelectorAll('#legend button').forEach(b=>b.addEventListener('click',()=>{
  show(b.dataset.k,b.dataset.id);
  document.getElementById('panel').scrollTo({top:0,behavior:'smooth'})}));
 document.getElementById('unmapped').innerHTML=M.unplaced.length?
  '<h2>'+M.unplaced.length+' lignes sans coordonnées</h2>'+M.unplaced.map(t=>
   '<div class="it"><div class="nm">'+esc(t.n)+'</div>'+(t.a?'<div class="ad">'+esc(t.a)+'</div>':'')+
   '<div class="rs">pas de lat/lon dans le CSV</div></div>').join(''):'';
 document.getElementById('count').textContent=M.count+(M.count!==TOTAL?' sur '+TOTAL:'')+' entreprises';
 if(M.sessions.length)show('s',M.sessions[0].id);
}
const HIDE=new Set(['java','angular','react','vue','typescript','nodejs','python','php','dotnet','cpp','sap']);
function renderTags(lists){
 const tc={};
 lists.forEach(a=>a.forEach(t=>{if(!HIDE.has(t))tc[t]=(tc[t]||0)+1}));
 const tb=document.getElementById('tagbar');tb.className='tgb';tb.style.display='';
 tb.innerHTML=Object.keys(tc).sort((a,b)=>tc[b]-tc[a]||a.localeCompare(b)).map(t=>'<button class="tg" data-t="'+esc(t)+'" aria-pressed="'+TAGSEL.has(t)+'">'+esc(tagName(t))+'<small>'+tc[t]+'</small></button>').join('');
 tb.querySelectorAll('.tg').forEach(b=>b.addEventListener('click',()=>{const t=b.dataset.t;
  if(TAGSEL.has(t))TAGSEL.delete(t);else TAGSEL.add(t);b.setAttribute('aria-pressed',String(TAGSEL.has(t)));window.refilter()}))}
function buildFilters(recs){renderTags(recs.map(r=>lst(r.tags)))}
function load(text){
 try{
  const recs=parseCSV(text);
  if(!recs.length) throw new Error('Aucune ligne de données.');
  if(!('lat' in recs[0])) throw new Error('No lat column. Header read as: '+Object.keys(recs[0]).join(', '));
  RECS=recs;TOTAL=recs.length;buildFilters(recs);initPlan();
  MODEL=buildModel(recs.filter(shown));
  if(MODEL.count && MODEL.unplaced.length===MODEL.count)
   throw new Error('Every row parsed without coordinates, so the columns are misaligned. Header read as: '+Object.keys(recs[0]).join(', '));
 }
 catch(e){ document.getElementById('count').textContent='Données illisibles : '+e.message;return }
 renderAll();
}
(async function(){
 chooseProvider();
 const refilter=()=>{if(!RECS)return;if(MODE==='plan'){if(planDay!==null)showPlanDay(planDay);return}const prev=cur;MODEL=buildModel(RECS.filter(shown));renderAll();
  if(prev&&prev.kind==='s'&&MODEL.sessions.some(x=>x.id===+prev.id))show(prev.kind,prev.id)};
 window.refilter=refilter;
 const fs=document.getElementById('fitsel');fs.value=FITSEL;
 if(HASFIT)document.getElementById('fitrow').style.display='';
 fs.addEventListener('change',()=>{FITSEL=fs.value;try{localStorage.setItem('fitsel',FITSEL)}catch(e){}refilter()});
 const el=document.getElementById('embedded');
 load(el.textContent.trim(),'');
})();
const tg=document.getElementById('toggle');
function sync(){tg.textContent=document.body.classList.contains('map-mode')?'Voir la liste':'Voir la carte';
 setTimeout(()=>map.invalidateSize(),240)}
tg.addEventListener('click',()=>{document.body.classList.toggle('map-mode');sync()});
if(window.matchMedia('(max-width:860px)').matches)sync();
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyFilter);
</script>
